# eGPU NVIDIA via Thunderbolt on Apple T2 Mac - MANDATORY config
# GSP MUST stay disabled: the T2 kills the machine on GSP firmware boot.
options nvidia NVreg_EnableGpuFirmware=0 NVreg_EnableMSI=0

# Prevent udev from loading/binding nvidia BEFORE egpu.service has fixed
# the BARs (bind happens only via the attach script, with explicit modprobe).
blacklist nvidia
blacklist nvidia_drm
blacklist nvidia_modeset
blacklist nouveau
